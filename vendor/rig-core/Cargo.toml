[package]
edition = "2024"
name = "rig-core"
version = "0.39.0"
description = "Core Rig library — agent, tools, providers, completion (vendor local copy)"
license = "MIT"
repository = "https://github.com/0xPlaygrounds/rig"

[lib]
name = "rig_core"
path = "src/lib.rs"

[features]
derive = ["dep:rig-derive"]
default = ["reqwest", "derive", "rustls"]
reqwest = ["reqwest/charset", "reqwest/http2", "reqwest/system-proxy"]
rustls = ["reqwest/rustls", "tokio-tungstenite?/rustls-tls-webpki-roots"]
test-utils = []

[dependencies]
# LLM completion protocol
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
eventsource-stream = "0.2"
fastrand = "2"
futures = "0.3"
futures-timer = "3"
glob = "0.3"
http = "1"
indexmap = "2"
mime = "0.3"
mime_guess = "2"
nanoid = "0.4"
ordered-float = "5"
pin-project-lite = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
tracing-futures = { version = "0.2", features = ["futures-03"] }
url = "2"

# HTTP client (default feature)
reqwest = { version = "0.13", features = ["json", "stream", "multipart"], default-features = false, optional = true }

# Derive macro (default feature)
rig-derive = { path = "../rig-derive", optional = true }

# WebSocket (for streaming providers with tool calls)
tokio-tungstenite = { version = "0.28", optional = true, default-features = false }

# as-any for downcasting
as-any = "0.3"


