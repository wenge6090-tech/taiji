# V43 converge Skill: 跨子任务一致性检查（BCP §10.1）
# dual: recursive-decompose（阳 Skill，P2 资产化后关联）
type: verification
layer: 1
id: converge-cross-consistency
name: 跨子任务一致性检查
description: |
  验证编排拆解的子任务结果之间是否相容一致：
  - 不同子任务的结论/数据是否冲突
  - 共享依赖的假设是否统一
  - 聚合综合后是否存在逻辑矛盾
tags:
  - converge
  - consistency
  - cross-check
  - quality
confidence: 0.7
version: 1
content: |
  子任务结果跨一致性验证：
  1. 数据一致性——不同子任务引用的共同数据/文件内容是否一致
  2. 假设一致性——不同子任务基于的隐含假设是否统一（不要求显式一致，但不应互相否定）
  3. 逻辑相容——子任务结论聚合后是否存在矛盾（A 说 X 成立，B 说 X 不成立）
agent_target: CausalAgent
checks:
  - id: cross-consistency-logic
    kind: llm_judgement
    target: "../*/deliverables/"
    params: {}
    severity: soft
    pass_condition: |
      逐文件检查各子任务 deliverables 后判定：
      1. 不同子任务引用的共同数据/文件内容是否一致（同一路径、同一内容）
      2. 子任务结论之间是否存在直接矛盾（A 说 X，B 说 not X）
      3. 聚合综合是否逻辑自洽（无"既 A 又非 A"）
status: active
