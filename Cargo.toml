[package]
name = "taiji"
version = "0.1.0"
edition = "2024"
description = "taiji — lightweight AGI cognitive kernel (TPN-DMN-NSKG)"

[dependencies]
# LLM agent framework
rig = { version = "0.39" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"

# Safety / trigger matching
regex = "1"

# Async trait support (used by skills module)
async-trait = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# MCP protocol
rmcp = { version = "0.8", features = ["server", "client", "transport-child-process"] }

# Rate limiting
tokio-util = "0.7"

# L1 Skills
memchr = "2"
reqwest = { version = "0.11", features = ["rustls-tls"], default-features = false }
tempfile = "3"
url = "2"

# WebSocket event server (taiji-web frontend bridge)
tokio-tungstenite = "0.24"
futures-util = "0.3"

# HTTP static hosting + WebSocket upgrade (pure-Web `taiji serve` mode)
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = "0.5"

[patch.crates-io]
rig = { path = "vendor/rig" }
rig-core = { path = "vendor/rig-core" }
rig-derive = { path = "vendor/rig-derive" }
